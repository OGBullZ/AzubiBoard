name: Deploy → Firebase Hosting

# Ersetzt den Netlify-Deploy (2026-06-12). Ziel: https://azubiboard-1fc20.web.app
#
# Benötigtes Secret (GitHub Repo Settings → Secrets → Actions):
#   FIREBASE_SERVICE_ACCOUNT — JSON eines Service Accounts mit Rolle "Firebase Hosting Admin"
#   (Anlegen: Firebase Console → Projekteinstellungen → Dienstkonten,
#    oder einmalig `firebase init hosting:github` ausführen)
# Solange das Secret fehlt, wird der Deploy-Schritt übersprungen (Workflow bleibt grün);
# manueller Deploy geht weiterhin lokal via `firebase deploy --only hosting`.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run tests before deploy
        run: npm test

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_BASE_PATH:    '/'
          # localStorage-Modus — Frontend-only, wie zuvor bei Netlify
          VITE_USE_API:      'false'
          VITE_APP_VERSION:  ${{ github.sha }}
          VITE_SENTRY_DSN:   ${{ secrets.VITE_SENTRY_DSN }}

      - name: Check Firebase secret
        id: secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT fehlt — Deploy übersprungen. Secret anlegen oder lokal 'firebase deploy --only hosting' nutzen."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error: Der Release-POST von firebase-tools ist nicht idempotent —
      # bei "premature close" auf der Antwort wiederholt die CLI den POST und bekommt
      # 400 "version is the current active version", obwohl das Release durch ist
      # (Phantom-Failure, mehrfach beobachtet seit 01.07.). Der Verify-Step unten
      # entscheidet anhand des Live-Inhalts, ob der Deploy wirklich fehlgeschlagen ist.
      - name: Deploy to Firebase Hosting
        id: deploy
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: azubiboard-1fc20
          channelId: live
          # gepinnt statt "latest" (Drift-Schutz); gleiche Version wie lokal installiert
          firebaseToolsVersion: 15.20.0
        timeout-minutes: 5

      - name: Verify deployment (Live-Inhalt = gebauter Stand?)
        if: steps.secret.outputs.present == 'true'
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "Deploy-Step erfolgreich — keine Verifikation nötig."
            exit 0
          fi
          echo "Deploy-Step rot — prüfe ob das Release trotzdem durch ist (Phantom-Failure-Muster)."
          want=$(sha256sum dist/index.html | cut -d' ' -f1)
          for i in 1 2 3 4 5; do
            got=$(curl -fsS https://azubiboard-1fc20.web.app/index.html | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then
              echo "::notice::Live-index.html entspricht dem Build ($want) — Release war serverseitig durch, Deploy-Fehler war ein Phantom (non-idempotenter Release-Retry nach premature close)."
              exit 0
            fi
            echo "Versuch $i/5: live=$got erwartet=$want — warte 10s (CDN-Propagation) …"
            sleep 10
          done
          echo "::error::Live-Inhalt entspricht NICHT dem Build — der Deploy ist wirklich fehlgeschlagen."
          exit 1
